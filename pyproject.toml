[project]
name = "speakup"
version = "0.1.0"
description = "Offline-first audio recording and transcript workflow"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
speakup-api = "speakup.api:main"
speakup-worker = "speakup.processor:main"

[tool.pytest.ini_options]
pythonpath = ["services"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services"]
include = ["speakup*"]
