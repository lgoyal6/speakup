name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: PYTHONPATH=services python -m unittest discover -s tests -p 'test*.py' -v
      - run: python -m compileall -q services tests scripts
      - run: python scripts/verify_container.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.8'}
      - run: yes | sdkmanager --licenses >/dev/null || true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle -p android assembleDebug
